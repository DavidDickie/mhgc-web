# Render Blueprint: one always-on web service with a small persistent disk for saved games.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: mhgc
    runtime: python
    plan: starter            # a disk needs a paid plan; free services also sleep and lose files
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SAVE_DIR
        value: /var/data/saves
      - key: MHGC_TRUST_PROXY        # read the visitor address from Render's X-Forwarded-For
        value: "1"
    disk:
      name: mhgc-saves
      mountPath: /var/data
      sizeGB: 1
